_version: 2
# The welcome (ui/js/hub/welcome.js) as the add-on has it: the game's folders and the account step
# (signed in, or on locally without sync; one account, one driver - hub-api's drivers), and the
# account's notice for another driver (ui/js/online/online.js). The old welcome's other texts are
# in app-omsihub.yml; Next, Skip, Browse and OMSI 2 folder from openOMSI's tables in Luc's fork.

