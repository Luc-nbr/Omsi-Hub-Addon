  uk: "Теки гри"
  pl: "Foldery gry"
"Where are openOMSI and OMSI 2?":
  nl: "Waar staan openOMSI en OMSI 2?"
  de: "Wo sind openOMSI und OMSI 2?"
  fr: "Où sont openOMSI et OMSI 2 ?"
  ru: "Где находятся openOMSI и OMSI 2?"
  uk: "Де знаходяться openOMSI та OMSI 2?"
  pl: "Gdzie są openOMSI i OMSI 2?"
"Omsi-Hub starts the openOMSI you have installed, on the maps and buses of the original OMSI 2. Point once to both folders.":
  nl: "Omsi-Hub start de openOMSI die je hebt geïnstalleerd, op de kaarten en bussen van het originele OMSI 2. Wijs eenmalig beide mappen aan."
  de: "Omsi-Hub startet das installierte openOMSI auf den Karten und Bussen des originalen OMSI 2. Zeige einmal auf beide Ordner."
  fr: "Omsi-Hub lance l'openOMSI que vous avez installé, sur les cartes et les bus de l'OMSI 2 d'origine. Indiquez une fois les deux dossiers."
  ru: "Omsi-Hub запускает установленный openOMSI на картах и автобусах оригинального OMSI 2. Укажите один раз обе папки."
  uk: "Omsi-Hub запускає встановлений openOMSI на картах і автобусах оригінального OMSI 2. Укажіть один раз обидві теки."
  pl: "Omsi-Hub uruchamia zainstalowany openOMSI na mapach i autobusach oryginalnego OMSI 2. Wskaż raz oba foldery."
"openOMSI 0.2.22 or newer. Steam, the box version, a folder you moved yourself - all fine. Omsi-Hub only reads them and never writes into the OMSI 2 folder.":
  nl: "openOMSI 0.2.22 of nieuwer. Steam, de doosversie, een map die je zelf hebt verplaatst - alles is goed. Omsi-Hub leest ze alleen en schrijft nooit in de OMSI 2-map."
  de: "openOMSI 0.2.22 oder neuer. Steam, die Boxversion, ein selbst verschobener Ordner - alles in Ordnung. Omsi-Hub liest sie nur und schreibt nie in den OMSI-2-Ordner."
  fr: "openOMSI 0.2.22 ou plus récent. Steam, la version boîte, un dossier déplacé vous-même - tout va bien. Omsi-Hub ne fait que les lire et n'écrit jamais dans le dossier OMSI 2."
  ru: "openOMSI 0.2.22 или новее. Steam, коробочная версия, перенесённая вами папка - всё подходит. Omsi-Hub только читает их и никогда не пишет в папку OMSI 2."
  uk: "openOMSI 0.2.22 або новіший. Steam, коробкова версія, тека, яку ви перемістили самі, - усе підходить. Omsi-Hub лише читає їх і ніколи не пише в теку OMSI 2."
  pl: "openOMSI 0.2.22 lub nowszy. Steam, wersja pudełkowa, folder przeniesiony samodzielnie - wszystko w porządku. Omsi-Hub tylko je czyta i nigdy nie zapisuje w folderze OMSI 2."
"Use these folders":
  nl: "Deze mappen gebruiken"
  de: "Diese Ordner verwenden"
  fr: "Utiliser ces dossiers"
  ru: "Использовать эти папки"
  uk: "Використати ці теки"
  pl: "Użyj tych folderów"
"Choose your openOMSI and OMSI 2 folders first.":
  nl: "Kies eerst je openOMSI- en OMSI 2-map."
  de: "Wähle zuerst deinen openOMSI- und OMSI-2-Ordner."
  fr: "Choisissez d'abord vos dossiers openOMSI et OMSI 2."
  ru: "Сначала выберите папки openOMSI и OMSI 2."
  uk: "Спершу виберіть теки openOMSI та OMSI 2."
  pl: "Najpierw wybierz foldery openOMSI i OMSI 2."
"Sign in, or play locally?":
  nl: "Inloggen, of lokaal spelen?"
  de: "Anmelden oder lokal spielen?"
  fr: "Se connecter, ou jouer en local ?"
  ru: "Войти или играть локально?"
  uk: "Увійти чи грати локально?"
  pl: "Zalogować się czy grać lokalnie?"
"With an account your driver has friends, the leaderboard and cloud saves on every computer. Without one, everything stays on this computer.":
  nl: "Met een account heeft je chauffeur vrienden, het klassement en cloud-saves op elke computer. Zonder account blijft alles op deze computer."
  de: "Mit einem Konto hat dein Fahrer Freunde, die Bestenliste und Cloud-Spielstände auf jedem Computer. Ohne Konto bleibt alles auf diesem Computer."
  fr: "Avec un compte, votre conducteur a des amis, le classement et des sauvegardes dans le cloud sur chaque ordinateur. Sans compte, tout reste sur cet ordinateur."
  ru: "С аккаунтом у вашего водителя есть друзья, таблица лидеров и облачные сохранения на любом компьютере. Без него всё остаётся на этом компьютере."
  uk: "З обліковим записом ваш водій має друзів, таблицю лідерів і хмарні збереження на будь-якому комп'ютері. Без нього все залишається на цьому комп'ютері."
  pl: "Z kontem twój kierowca ma znajomych, ranking i zapisy w chmurze na każdym komputerze. Bez konta wszystko zostaje na tym komputerze."
"Continue locally without sync":
  nl: "Doorgaan lokaal zonder sync"
  de: "Lokal ohne Synchronisierung weiter"
  fr: "Continuer en local sans synchronisation"
  ru: "Продолжить локально без синхронизации"
  uk: "Продовжити локально без синхронізації"
  pl: "Kontynuuj lokalnie bez synchronizacji"
"Friends, the leaderboard and your cloud saves go with %{name}.":
  nl: "Vrienden, het klassement en je cloud-saves horen bij %{name}."
  de: "Freunde, die Bestenliste und deine Cloud-Spielstände gehören zu %{name}."
  fr: "Les amis, le classement et vos sauvegardes dans le cloud vont avec %{name}."
  ru: "Друзья, таблица лидеров и облачные сохранения принадлежат %{name}."
  uk: "Друзі, таблиця лідерів і хмарні збереження належать %{name}."
  pl: "Znajomi, ranking i zapisy w chmurze należą do %{name}."
"Your display name is your driver's name too.":
  nl: "Je weergavenaam is ook de naam van je chauffeur."
  de: "Dein Anzeigename ist auch der Name deines Fahrers."
  fr: "Votre nom affiché est aussi le nom de votre conducteur."
  ru: "Ваше отображаемое имя - это и имя вашего водителя."
  uk: "Ваше відображуване ім'я - це й ім'я вашого водія."
  pl: "Twoja nazwa wyświetlana jest też imieniem twojego kierowcy."
"Your account's driver: their duties, kilometres and level go with your account.":
  nl: "De chauffeur van je account: zijn diensten, kilometers en niveau gaan mee met je account."
  de: "Der Fahrer deines Kontos: seine Dienste, Kilometer und Stufe gehen mit deinem Konto."
  fr: "Le conducteur de votre compte : ses services, ses kilomètres et son niveau suivent votre compte."
  ru: "Водитель вашего аккаунта: его смены, километры и уровень привязаны к аккаунту."
  uk: "Водій вашого облікового запису: його наряди, кілометри й рівень прив'язані до облікового запису."
  pl: "Kierowca twojego konta: jego służby, kilometry i poziom idą z twoim kontem."
"Your duties, kilometres and level are kept per driver, on this computer.":
  nl: "Je diensten, kilometers en niveau worden per chauffeur bijgehouden, op deze computer."
  de: "Deine Dienste, Kilometer und Stufe werden pro Fahrer gespeichert, auf diesem Computer."
  fr: "Vos services, kilomètres et niveau sont gardés par conducteur, sur cet ordinateur."
  ru: "Смены, километры и уровень хранятся для каждого водителя на этом компьютере."
  uk: "Наряди, кілометри й рівень зберігаються для кожного водія на цьому комп'ютері."
  pl: "Służby, kilometry i poziom są zapisywane dla każdego kierowcy na tym komputerze."
"This driver has the account on this computer":
  nl: "Deze chauffeur heeft het account op deze computer"
  de: "Dieser Fahrer hat das Konto auf diesem Computer"
  fr: "Ce conducteur a le compte de cet ordinateur"
  ru: "У этого водителя аккаунт на этом компьютере"
  uk: "У цього водія обліковий запис на цьому комп'ютері"
  pl: "Ten kierowca ma konto na tym komputerze"
"This driver has your account: sign out first.":
  nl: "Deze chauffeur heeft je account: log eerst uit."
  de: "Dieser Fahrer hat dein Konto: melde dich zuerst ab."
  fr: "Ce conducteur a votre compte : déconnectez-vous d'abord."
  ru: "У этого водителя ваш аккаунт: сначала выйдите."
  uk: "У цього водія ваш обліковий запис: спершу вийдіть."
  pl: "Ten kierowca ma twoje konto: najpierw się wyloguj."
"The account on this computer is %{name}'s. %{driver} plays locally, without friends, the leaderboard or cloud saves.":
  nl: "Het account op deze computer is van %{name}. %{driver} speelt lokaal, zonder vrienden, klassement of cloud-saves."
  de: "Das Konto auf diesem Computer gehört %{name}. %{driver} spielt lokal, ohne Freunde, Bestenliste oder Cloud-Spielstände."
  fr: "Le compte de cet ordinateur est celui de %{name}. %{driver} joue en local, sans amis, classement ni sauvegardes dans le cloud."
  ru: "Аккаунт на этом компьютере принадлежит %{name}. %{driver} играет локально, без друзей, таблицы лидеров и облачных сохранений."
  uk: "Обліковий запис на цьому комп'ютері належить %{name}. %{driver} грає локально, без друзів, таблиці лідерів і хмарних збережень."
  pl: "Konto na tym komputerze należy do %{name}. %{driver} gra lokalnie, bez znajomych, rankingu i zapisów w chmurze."
"Choose %{name} under \"Who is driving today?\" to use the account.":
  nl: "Kies %{name} bij \"Wie rijdt er vandaag?\" om het account te gebruiken."
  de: "Wähle %{name} unter „Wer fährt heute?“, um das Konto zu verwenden."
  fr: "Choisissez %{name} sous « Qui conduit aujourd'hui ? » pour utiliser le compte."
  ru: "Выберите %{name} в «Кто сегодня за рулём?», чтобы пользоваться аккаунтом."
  uk: "Виберіть %{name} у «Хто сьогодні за кермом?», щоб користуватися обліковим записом."
  pl: "Wybierz %{name} w „Kto dziś jedzie?”, aby korzystać z konta."
"Dutch":
  nl: "Nederlands"
  de: "Niederländisch"
  fr: "Néerlandais"
  ru: "Нидерландские"
  uk: "Нідерландські"
  pl: "Holenderskie"
"Stop signs":
  nl: "Haltebordjes"
  de: "Haltestellenschilder"
  fr: "Panneaux d'arrêt"
  ru: "Знаки остановок"
  uk: "Знаки зупинок"
  pl: "Znaki przystanków"
"Which bus stop signs?":
  nl: "Welke haltebordjes?"
  de: "Welche Haltestellenschilder?"
  fr: "Quels panneaux d'arrêt ?"
  ru: "Какие знаки остановок?"
  uk: "Які знаки зупинок?"
  pl: "Jakie znaki przystanków?"
"The maps mark every stop with a bus stop sign. Choose the ones you know; you can change them any time in the settings.":
  nl: "De kaarten tonen elke halte met een haltebordje. Kies de bordjes die je kent; je kunt ze altijd wijzigen in de instellingen."
  de: "Die Karten zeigen jede Haltestelle mit einem Haltestellenschild. Wähle die Schilder, die du kennst; du kannst sie jederzeit in den Einstellungen ändern."
  fr: "Les cartes marquent chaque arrêt d'un panneau d'arrêt. Choisissez ceux que vous connaissez ; vous pouvez les changer à tout moment dans les paramètres."
  ru: "На картах каждая остановка отмечена знаком. Выберите привычные знаки; их можно изменить в настройках в любой момент."
  uk: "На картах кожна зупинка позначена знаком. Виберіть звичні знаки; їх можна змінити в налаштуваннях будь-коли."
  pl: "Mapy oznaczają każdy przystanek znakiem przystanku. Wybierz te, które znasz; możesz je zmienić w każdej chwili w ustawieniach."
