_version: 2
# The phone and tablet companion on the Settings page (General › Phone & tablet): the Omsi-Hub
# Companion app paired by its QR code or address and code (ui/js/hub/companion.js,
# crates/hub-api/src/companion.rs).
"Sign on, see your duty, the route and the control room's messages, and work the bus's IBIS and ticket printer from the Omsi-Hub Companion app on a phone or tablet in your network.":
  de: "Melde dich an, sieh deinen Dienst, die Route und die Nachrichten der Leitstelle und bediene IBIS und Fahrscheindrucker des Busses mit der Omsi-Hub-Companion-App auf einem Handy oder Tablet in deinem Netzwerk."
  fr: "Prenez votre service, voyez votre service, l'itinéraire et les messages du poste de contrôle, et utilisez l'IBIS et l'imprimante à billets du bus depuis l'app Omsi-Hub Companion sur un téléphone ou une tablette de votre réseau."
  nl: "Meld je aan, zie je dienst, de route en de berichten van de verkeersleiding, en bedien de IBIS en de kaartautomaat van de bus met de Omsi-Hub Companion-app op een telefoon of tablet in je netwerk."
  pl: "Zaloguj się, zobacz służbę, trasę i wiadomości dyspozytorni oraz obsługuj IBIS i drukarkę biletów autobusu w aplikacji Omsi-Hub Companion na telefonie lub tablecie w twojej sieci."
  ru: "Отмечайтесь, смотрите наряд, маршрут и сообщения диспетчерской и управляйте IBIS и билетным принтером автобуса в приложении Omsi-Hub Companion на телефоне или планшете в вашей сети."
  uk: "Відмічайтеся, дивіться наряд, маршрут і повідомлення диспетчерської та керуйте IBIS і квитковим принтером автобуса в застосунку Omsi-Hub Companion на телефоні чи планшеті у вашій мережі."
