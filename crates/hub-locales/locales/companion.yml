"Only devices in your own network reach it, and only with a pairing code. Your firewall may ask to let Omsi-Hub take connections: allow it for private networks.":
  de: "Nur Geräte in deinem eigenen Netzwerk erreichen es, und nur mit einem Kopplungscode. Deine Firewall fragt vielleicht, ob Omsi-Hub Verbindungen annehmen darf: Erlaube es für private Netzwerke."
  fr: "Seuls les appareils de votre propre réseau y accèdent, et seulement avec un code d'appairage. Votre pare-feu peut demander d'autoriser les connexions d'Omsi-Hub : autorisez-les pour les réseaux privés."
  nl: "Alleen apparaten in je eigen netwerk bereiken het, en alleen met een koppelcode. Je firewall vraagt misschien of Omsi-Hub verbindingen mag aannemen: sta het toe voor privénetwerken."
  pl: "Dostęp mają tylko urządzenia z twojej sieci i tylko z kodem parowania. Zapora może zapytać, czy Omsi-Hub może przyjmować połączenia: zezwól na to w sieciach prywatnych."
  ru: "Доступ есть только у устройств вашей сети и только с кодом сопряжения. Брандмауэр может спросить, разрешить ли Omsi-Hub принимать подключения: разрешите для частных сетей."
  uk: "Доступ мають лише пристрої вашої мережі й лише з кодом з'єднання. Брандмауер може запитати, чи дозволити Omsi-Hub приймати з'єднання: дозвольте для приватних мереж."
