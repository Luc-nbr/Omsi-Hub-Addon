"Pick a line first. As in OMSI, the start time and date then say where in the tour the bus is: the trip under way, or the next to leave.":
  nl: "Kies eerst een lijn. Zoals in OMSI bepalen de starttijd en de datum dan waar in de omloop de bus is: de rit die onderweg is, of de volgende die vertrekt."
  de: "Wähle zuerst eine Linie. Wie in OMSI sagen Startzeit und Datum dann, wo im Umlauf der Bus ist: die laufende Fahrt oder die nächste, die abfährt."
  fr: "Choisissez d’abord une ligne. Comme dans OMSI, l’heure et la date de départ disent alors où en est le bus dans la tournée : le trajet en cours, ou le prochain à partir."
  pl: "Najpierw wybierz linię. Jak w OMSI, godzina i data startu mówią wtedy, gdzie w brygadzie jest autobus: kurs w trakcie albo następny do odjazdu."
  ru: "Сначала выберите маршрут. Как в OMSI, время и дата старта тогда определяют, где на выходе автобус: текущий рейс или следующий к отправлению."
  uk: "Спочатку виберіть маршрут. Як в OMSI, час і дата старту тоді визначають, де на виході автобус: поточний рейс або наступний до відправлення."
