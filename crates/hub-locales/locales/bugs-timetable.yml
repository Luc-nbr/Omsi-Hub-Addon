_version: 2
# The testers' timetable bugs: the return's own times, loops (ring lines), scrolling the
# timetables: the English text is the key, as in app.yml.
"Trip takes":
  de: "Fahrt dauert"
  fr: "Le trajet dure"
  nl: "Rit duurt"
  pl: "Kurs trwa"
  ru: "Рейс длится"
  uk: "Рейс триває"
"Leaves as the outbound does":
  de: "Fährt wie die Hinfahrt ab"
  fr: "Part comme l'aller"
  nl: "Vertrekt zoals de heenrit"
  pl: "Odjeżdża jak kurs tam"
  ru: "Отправляется как прямой рейс"
  uk: "Відправляється як прямий рейс"
"The return leaves at the outbound's times. Switch this off to give it departures of its own.":
  de: "Die Rückfahrt fährt zu den Zeiten der Hinfahrt ab. Schalte dies aus, um ihr eigene Abfahrten zu geben."
  fr: "Le retour part aux horaires de l'aller. Désactive ceci pour lui donner ses propres départs."
  nl: "De terugrit vertrekt op de tijden van de heenrit. Zet dit uit om hem eigen vertrektijden te geven."
  pl: "Kurs powrotny odjeżdża o godzinach kursu tam. Wyłącz to, aby nadać mu własne odjazdy."
  ru: "Обратный рейс отправляется по времени прямого. Выключите это, чтобы задать ему свои отправления."
  uk: "Зворотний рейс відправляється за часом прямого. Вимкніть це, щоб задати йому власні відправлення."
"The return has departures of its own: choose Return above to change them.":
  de: "Die Rückfahrt hat eigene Abfahrten: wähle oben Zurück, um sie zu ändern."
  fr: "Le retour a ses propres départs : choisis Retour ci-dessus pour les modifier."
  nl: "De terugrit heeft eigen vertrektijden: kies hierboven Terug om ze te wijzigen."
  pl: "Kurs powrotny ma własne odjazdy: wybierz powyżej Powrót, aby je zmienić."
  ru: "У обратного рейса свои отправления: выберите выше «Обратно», чтобы их изменить."
  uk: "Зворотний рейс має власні відправлення: виберіть вище «Назад», щоб їх змінити."
"Close the loop: back to the first stop":
  de: "Schleife schließen: zurück zur ersten Haltestelle"
  fr: "Fermer la boucle : retour au premier arrêt"
  nl: "Lus sluiten: terug naar de eerste halte"
  pl: "Zamknij pętlę: powrót do pierwszego przystanku"
  ru: "Замкнуть кольцо: обратно к первой остановке"
  uk: "Замкнути кільце: назад до першої зупинки"
"Open the loop":
  de: "Schleife öffnen"
  fr: "Ouvrir la boucle"
  nl: "Lus openen"
  pl: "Otwórz pętlę"
  ru: "Разомкнуть кольцо"
  uk: "Розімкнути кільце"
"Loop: %{name}":
  de: "Schleife: %{name}"
  fr: "Boucle : %{name}"
  nl: "Lus: %{name}"
  pl: "Pętla: %{name}"
  ru: "Кольцо: %{name}"
  uk: "Кільце: %{name}"
"The loop is open: the line ends at its last stop again":
  de: "Die Schleife ist offen: die Linie endet wieder an ihrer letzten Haltestelle"
  fr: "La boucle est ouverte : la ligne se termine de nouveau à son dernier arrêt"
  nl: "De lus is open: de lijn eindigt weer bij haar laatste halte"
  pl: "Pętla jest otwarta: linia znów kończy się na ostatnim przystanku"
  ru: "Кольцо разомкнуто: линия снова заканчивается на последней остановке"
  uk: "Кільце розімкнуто: лінія знову закінчується на останній зупинці"
"The loop is closed: the bus drives back to its first stop and starts again there":
  de: "Die Schleife ist geschlossen: der Bus fährt zurück zur ersten Haltestelle und beginnt dort von Neuem"
  fr: "La boucle est fermée : le bus revient à son premier arrêt et y repart"
  nl: "De lus is gesloten: de bus rijdt terug naar de eerste halte en begint daar opnieuw"
  pl: "Pętla jest zamknięta: autobus wraca do pierwszego przystanku i tam zaczyna od nowa"
  ru: "Кольцо замкнуто: автобус возвращается к первой остановке и начинает оттуда снова"
  uk: "Кільце замкнуто: автобус повертається до першої зупинки й починає звідти знову"
# The Timetable page (a map's lines, their tours and trips): its buttons and what it says.
"Reset timetable":
  nl: "Dienstregeling resetten"
  de: "Fahrplan zurücksetzen"
  fr: "Réinitialiser l'horaire"
  ru: "Сбросить расписание"
  uk: "Скинути розклад"
  pl: "Zresetuj rozkład"
"Press again to reset":
  nl: "Druk nogmaals om te resetten"
  de: "Zum Zurücksetzen noch einmal drücken"
  fr: "Appuyez à nouveau pour réinitialiser"
  ru: "Нажмите ещё раз для сброса"
  uk: "Натисніть ще раз, щоб скинути"
  pl: "Naciśnij ponownie, by zresetować"
"This map has no timetable (no TTData lines).":
  nl: "Deze kaart heeft geen dienstregeling (geen TTData-lijnen)."
  de: "Diese Karte hat keinen Fahrplan (keine TTData-Linien)."
  fr: "Cette carte n'a pas d'horaire (aucune ligne TTData)."
  ru: "У этой карты нет расписания (нет линий TTData)."
  uk: "Ця мапа не має розкладу (немає ліній TTData)."
  pl: "Ta mapa nie ma rozkładu (brak linii TTData)."
"New line (name)":
  nl: "Nieuwe lijn (naam)"
  de: "Neue Linie (Name)"
  fr: "Nouvelle ligne (nom)"
  ru: "Новая линия (название)"
  uk: "Нова лінія (назва)"
  pl: "Nowa linia (nazwa)"
"New tour":
  nl: "Nieuwe omloop"
  de: "Neuer Umlauf"
  fr: "Nouveau service"
  ru: "Новый выход"
  uk: "Новий оборот"
  pl: "Nowa brygada"
"Copy +min":
  nl: "Kopie +min"
  de: "Kopie +Min."
  fr: "Copie +min"
  ru: "Копия +мин"
  uk: "Копія +хв"
  pl: "Kopia +min"
"until h:mm":
  nl: "tot h:mm"
  de: "bis h:mm"
  fr: "jusqu'à h:mm"
  ru: "до h:mm"
  uk: "до h:mm"
  pl: "do h:mm"
"Repeat":
  nl: "Herhalen"
  de: "Wiederholen"
  fr: "Répéter"
  ru: "Повторить"
  uk: "Повторити"
  pl: "Powtórz"
"Delete tour":
  nl: "Omloop verwijderen"
  de: "Umlauf löschen"
  fr: "Supprimer le service"
  ru: "Удалить выход"
  uk: "Видалити оборот"
  pl: "Usuń brygadę"
"Add trip":
  nl: "Rit toevoegen"
  de: "Fahrt hinzufügen"
  fr: "Ajouter un trajet"
  ru: "Добавить рейс"
  uk: "Додати рейс"
  pl: "Dodaj kurs"
"Remove this trip":
  nl: "Deze rit verwijderen"
  de: "Diese Fahrt entfernen"
  fr: "Retirer ce trajet"
  ru: "Убрать этот рейс"
  uk: "Прибрати цей рейс"
  pl: "Usuń ten kurs"
"A departure is not a time (h:mm).":
  nl: "Een vertrek is geen tijd (h:mm)."
  de: "Eine Abfahrt ist keine Uhrzeit (h:mm)."
  fr: "Un départ n'est pas une heure (h:mm)."
  ru: "Одно из отправлений — не время (h:mm)."
  uk: "Одне з відправлень — не час (h:mm)."
  pl: "Jeden z odjazdów nie jest godziną (h:mm)."
"Type the minutes the copy runs later (negative for earlier).":
  nl: "Typ hoeveel minuten later de kopie rijdt (negatief voor eerder)."
  de: "Gib ein, wie viele Minuten später die Kopie fährt (negativ für früher)."
  fr: "Saisissez de combien de minutes la copie part plus tard (négatif pour plus tôt)."
  ru: "Введите, на сколько минут позже идёт копия (отрицательное число — раньше)."
  uk: "Введіть, на скільки хвилин пізніше йде копія (від'ємне число — раніше)."
  pl: "Wpisz, o ile minut później jedzie kopia (liczba ujemna — wcześniej)."
"Type the minutes between the tours (1 or more) in the field above":
  nl: "Typ de minuten tussen de omlopen (1 of meer) in het veld erboven"
  de: "Gib die Minuten zwischen den Umläufen (1 oder mehr) im Feld darüber ein"
  fr: "Saisissez les minutes entre les services (1 ou plus) dans le champ au-dessus"
  ru: "Введите минуты между выходами (1 или больше) в поле выше"
  uk: "Введіть хвилини між оборотами (1 або більше) в полі вище"
  pl: "Wpisz minuty między brygadami (1 lub więcej) w polu powyżej"
"Type the last departure as h:mm":
  nl: "Typ het laatste vertrek als h:mm"
  de: "Gib die letzte Abfahrt als h:mm ein"
  fr: "Saisissez le dernier départ au format h:mm"
  ru: "Введите последнее отправление как h:mm"
  uk: "Введіть останнє відправлення як h:mm"
  pl: "Wpisz ostatni odjazd jako h:mm"
"The line has no tour yet: make one with New tour":
  nl: "De lijn heeft nog geen omloop: maak er een met Nieuwe omloop"
  de: "Die Linie hat noch keinen Umlauf: lege einen mit Neuer Umlauf an"
  fr: "La ligne n'a pas encore de service : créez-en un avec Nouveau service"
  ru: "У линии ещё нет выхода: создайте его кнопкой «Новый выход»"
  uk: "У лінії ще немає обороту: створіть його кнопкою «Новий оборот»"
  pl: "Linia nie ma jeszcze brygady: utwórz ją przyciskiem Nowa brygada"
"Type the minutes to shift by":
  nl: "Typ met hoeveel minuten te verschuiven"
  de: "Gib die Minuten ein, um die verschoben wird"
  fr: "Saisissez de combien de minutes décaler"
  ru: "Введите, на сколько минут сдвинуть"
  uk: "Введіть, на скільки хвилин зсунути"
  pl: "Wpisz, o ile minut przesunąć"
"openOMSI's content folder is not there: choose the openOMSI folder in the Settings":
  nl: "De contentmap van openOMSI is er niet: kies de openOMSI-map in de Instellingen"
  de: "Der Inhaltsordner von openOMSI ist nicht da: wähle den openOMSI-Ordner in den Einstellungen"
  fr: "Le dossier de contenu d'openOMSI est introuvable : choisissez le dossier openOMSI dans les Paramètres"
  ru: "Папки контента openOMSI нет: выберите папку openOMSI в настройках"
  uk: "Теки контенту openOMSI немає: виберіть теку openOMSI в налаштуваннях"
  pl: "Brak folderu zawartości openOMSI: wybierz folder openOMSI w Ustawieniach"
"The tour has no trips yet: give it one with Add trip":
  nl: "De omloop heeft nog geen ritten: geef hem er een met Rit toevoegen"
  de: "Der Umlauf hat noch keine Fahrten: gib ihm eine mit Fahrt hinzufügen"
  fr: "Le service n'a pas encore de trajet : ajoutez-en un avec Ajouter un trajet"
  ru: "У выхода ещё нет рейсов: добавьте рейс кнопкой «Добавить рейс»"
  uk: "В обороту ще немає рейсів: додайте рейс кнопкою «Додати рейс»"
  pl: "Brygada nie ma jeszcze kursów: dodaj kurs przyciskiem Dodaj kurs"
"The timetable of %{map} is the map's own again (the edited copy was removed)":
  nl: "De dienstregeling van %{map} is weer die van de kaart (de bewerkte kopie is verwijderd)"
  de: "Der Fahrplan von %{map} ist wieder der der Karte (die bearbeitete Kopie wurde entfernt)"
  fr: "L'horaire de %{map} est de nouveau celui de la carte (la copie modifiée a été supprimée)"
  ru: "Расписание %{map} снова как на карте (изменённая копия удалена)"
  uk: "Розклад %{map} знову як на мапі (змінену копію видалено)"
  pl: "Rozkład %{map} jest znów rozkładem mapy (edytowana kopia została usunięta)"
"%{n} line(s) of %{map} put back as they were":
  nl: "%{n} lijn(en) van %{map} teruggezet zoals ze waren"
  de: "%{n} Linie(n) von %{map} wiederhergestellt, wie sie waren"
  fr: "%{n} ligne(s) de %{map} remise(s) comme avant"
  ru: "%{n} лини(й) %{map} возвращено как было"
  uk: "%{n} лінію(ї) %{map} повернуто як було"
  pl: "%{n} lini(e) mapy %{map} przywrócono do stanu sprzed zmian"
"The timetable of this map has not been changed here":
  nl: "De dienstregeling van deze kaart is hier niet gewijzigd"
  de: "Der Fahrplan dieser Karte wurde hier nicht geändert"
  fr: "L'horaire de cette carte n'a pas été modifié ici"
  ru: "Расписание этой карты здесь не изменялось"
  uk: "Розклад цієї мапи тут не змінювався"
  pl: "Rozkład tej mapy nie był tu zmieniany"
