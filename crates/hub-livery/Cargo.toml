[package]
name = "hub-livery"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Omsi-Hub's livery studio's core (the old app's omsihub-livery): the project, the bake, the paint on the CPU and the livery written into the game"

[dependencies]
glam.workspace = true
log.workspace = true
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
ab_glyph.workspace = true
# shapes, outlines and SVG pictures rasterised
resvg = { version = "0.45", default-features = false }
hub-core.workspace = true
omsi-cfg.workspace = true
omsi-model.workspace = true
omsi-sim.workspace = true
omsi-texture.workspace = true
omsi-vehicle.workspace = true

[dev-dependencies]
# (the tests write pictures for the export and the picture reader)
image.workspace = true

[features]
# what the studio's tests see: the box bus, a texel's share of paint
test-support = []
